[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "irondome-sdk"
version = "0.1.0"
description = "Secure, pooled synchronous and asyncio clients for the IronDome API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.11"
dependencies = ["httpx[http2]>=0.28.1,<1"]

[project.urls]
Homepage = "https://irondome.dev/docs/guides/python"
Repository = "https://github.com/IrondomeDev/sdks"
Issues = "https://github.com/IrondomeDev/sdks/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["irondome*"]

[tool.setuptools.package-data]
irondome = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
