name: Publish Rust SDK
on:
  push:
    tags: ['rust/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example rust/v0.2.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-crates
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: node scripts/check-release.mjs rust
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      - run: cargo test --locked && cargo clippy --locked --all-targets -- -D warnings && cargo fmt --check && cargo package --locked
        working-directory: rust
  publish:
    if: vars.CRATES_RELEASE_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - if: env.CARGO_REGISTRY_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: auth
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo publish --locked
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN || steps.auth.outputs.token }}
