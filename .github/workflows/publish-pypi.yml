name: Publish Python SDK
on:
  push:
    tags: ['python/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example python/v0.2.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-pypi
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: node scripts/check-release.mjs python
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      - run: python -m pip install -e '.[test]' build twine && python -m pytest -q && python -m build && python -m twine check dist/*
        working-directory: python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-sdk
          path: python/dist/*
          if-no-files-found: error
  publish:
    if: vars.PYPI_RELEASE_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-sdk
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
